name: Mise à jour de La Vigie

on:
  schedule:
    # GitHub saute souvent les créneaux planifiés (tâches "au mieux possible").
    # On tente donc 4 fois par heure pour qu'au moins une passe réellement.
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:           # permet aussi un lancement manuel depuis GitHub

permissions:
  contents: write              # autorise le bot à publier les mises à jour

concurrency:
  group: maj-vigie
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v6

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Réparer d'éventuels conflits Git
        run: python3 reparer_conflits.py

      - name: Lancer la veille
        run: python3 generer_site.py

      - name: Publier s'il y a du nouveau
        run: |
          git config user.name  "La Vigie (bot)"
          git config user.email "actions@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Veille : mise à jour automatique"
            git push
            echo "Mise à jour publiée."
          else
            echo "Aucun changement — rien à publier."
          fi
