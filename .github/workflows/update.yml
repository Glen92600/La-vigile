name: Mise à jour de La Vigie

on:
  schedule:
    - cron: "17 * * * *"     # toutes les heures (minute 17, pour lisser la charge)
  workflow_dispatch:           # permet aussi un lancement manuel depuis GitHub

permissions:
  contents: write              # autorise le bot à publier les mises à jour

concurrency:
  group: maj-vigie
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer la veille
        run: python3 generer_site.py

      - name: Publier s'il y a du nouveau
        run: |
          git config user.name  "La Vigie (bot)"
          git config user.email "actions@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Veille : mise à jour automatique"
            git push
            echo "Mise à jour publiée."
          else
            echo "Aucun changement — rien à publier."
          fi
